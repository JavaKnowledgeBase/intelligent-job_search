services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
